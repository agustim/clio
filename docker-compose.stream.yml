# Emissió headless a Twitch (sense OBS): `clio` serveix l'overlay (/overlay +
# /overlay/ticker.json) i `stream` el captura (Xvfb + Chromium) i el puja per
# RTMP amb ffmpeg. 24/7.
#
# Ús: afegiu TWITCH_STREAM_KEY=... a .env i
#   docker compose -f docker-compose.stream.yml up -d --build
services:
  clio:
    build: .
    image: ghcr.io/agustim/clio:latest
    restart: unless-stopped
    env_file: .env
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: sqlite://data/linkanalyzer.db
      PUBLIC_DIR: public
    volumes:
      - ./data:/app/data                        # SQLite (font de veritat)
      - ./.fastembed_cache:/app/.fastembed_cache

  stream:
    build:
      context: .
      dockerfile: Dockerfile.stream
    restart: unless-stopped
    depends_on:
      - clio
    environment:
      OVERLAY_URL: http://clio:8080/overlay
      TWITCH_RTMP_URL: ${TWITCH_RTMP_URL:-rtmp://live.twitch.tv/app}
      TWITCH_STREAM_KEY: ${TWITCH_STREAM_KEY:?cal TWITCH_STREAM_KEY a .env}
      # El Chromium kiosk força sempre 1920x1080, per tant l'escena es captura a
      # 1080p (si la pantalla fossis més petita, el contingut es retallaria).
      WIDTH: ${OVERLAY_WIDTH:-1920}
      HEIGHT: ${OVERLAY_HEIGHT:-1080}
      FPS: ${OVERLAY_FPS:-30}
