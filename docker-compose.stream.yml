# Emissió headless a Twitch (sense OBS) fent servir les imatges PUBLICADES a
# ghcr.io (el workflow de release les puja: `clio` = lleugera, `clio-stream` =
# "tot en un" amb Xvfb+Chromium+ffmpeg).
#
# Usos:
#   docker compose -f docker-compose.stream.yml pull          # baixa les imatges
#   docker compose -f docker-compose.stream.yml up -d         # aixeca el directe
#
# Si prefereixes construir-les des d'aquest repo (en lloc de baixar-les),
# descomenta els blocs `build` de sota.
#
# Recordatori: `clio-stream` s'ha de publicar abans amb una release
# (`scripts/release.sh patch`) o bé `docker build --target stream -t ghcr.io/agustim/clio-stream:latest .`
services:
  clio:
    image: ghcr.io/agustim/clio:latest
    # build:
    #   context: .
    #   target: app
    restart: unless-stopped
    env_file: .env
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: sqlite://data/linkanalyzer.db
      PUBLIC_DIR: public
    volumes:
      - ./data:/app/data                        # SQLite (font de veritat)
      - ./.fastembed_cache:/app/.fastembed_cache

  stream:
    # Imatge "tot en un" (conté clio + Xvfb + Chromium + ffmpeg); el
    # dispatcher arrenca l'emissió gràcies a CLIO_MODE=stream.
    image: ghcr.io/agustim/clio-stream:latest
    # build:
    #   context: .
    #   target: stream
    restart: unless-stopped
    depends_on:
      - clio
    environment:
      CLIO_MODE: stream
      OVERLAY_URL: http://clio:8080/overlay
      TWITCH_RTMP_URL: ${TWITCH_RTMP_URL:-rtmp://live.twitch.tv/app}
      TWITCH_STREAM_KEY: ${TWITCH_STREAM_KEY:?cal TWITCH_STREAM_KEY a .env}
      # Per defecte l'script prova VAAPI i cau a libx264 si no hi és; pots
      # forçar el mode amb ENCODER=vaapi o ENCODER=software.
      ENCODER: ${ENCODER:-auto}
      # Força el driver VA-API (només cal en cas de dubte): Intel -> iHD
      # (per Ex. LIBVA_DRIVER_NAME=iHD al .env); en blanc libva auto-detecta
      # (AMD -> radeonsi, Intel -> iHD).
      LIBVA_DRIVER_NAME: ${LIBVA_DRIVER_NAME:-}
      # El Chromium kiosk força sempre 1920x1080, per tant l'escena es captura a
      # 1080p (si la pantalla fos més petita, el contingut es retallaria).
      WIDTH: ${OVERLAY_WIDTH:-1920}
      HEIGHT: ${OVERLAY_HEIGHT:-1080}
      FPS: ${OVERLAY_FPS:-30}
    devices:
      # GPU (recomanada): passa el node de render (AMD o Intel) al container
      # per codificar amb VAAPI (h264_vaapi) i descarregar la CPU. A l'Intel
      # Kabylake és /dev/dri/renderD128 igualment.
      # Si la màquina d'emissió no té /dev/dri, comenta aquest bloc.
      - /dev/dri/renderD128:/dev/dri/renderD128
